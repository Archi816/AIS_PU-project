services:
  backend:
    build: ./backend
    image: lems-backend-local
    container_name: lems-backend-local
    expose: ["8080"]
    env_file:
      - ./backend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Databases__Core__Provider: Sqlite
      Databases__Core__ConnectionString: Data Source=/tmp/lems-core.db
      Databases__Ops__Provider: Sqlite
      Databases__Ops__ConnectionString: Data Source=/tmp/lems-ops.db
      AiService__BaseUrl: http://host.docker.internal:8000
      Security__BehindProxy: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: lems-frontend-local
    container_name: lems-frontend-local
    ports:
      - "5000:8080"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
